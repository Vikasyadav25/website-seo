name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m ruff check agents scripts
      - run: python -m pytest agents/tests
      - run: python scripts/validate-public-data.py web/public/data/report.json examples/demo-report.json examples/disconnected-report.json
      - run: pnpm build
        env:
          PAGES_BASE_PATH: /website-seo/
      - run: python scripts/scan-secrets.py dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
