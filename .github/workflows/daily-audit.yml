name: Daily audit
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: DEMO fixtures or configured read-only production
        type: choice
        options: [demo, production]
        default: demo
permissions:
  contents: read
concurrency:
  group: daily-audit
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Generate read-only report or labelled DEMO fixture
        run: |
          if [ "$AUDIT_MODE" = "production" ]; then
            python -m agents.main --mode production --read-only --collect --repository-url "$REPOSITORY_URL" --output private/public-report.json
          else
            python -m agents.main --mode demo --repository-url "$REPOSITORY_URL" --output private/public-report.json
          fi
        env:
          AUDIT_MODE: ${{ inputs.mode || vars.AUDIT_MODE || 'demo' }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          DRY_RUN: "true"
          PUBLISH_ENABLED: "false"
          ENABLE_SHOPIFY_WRITES: "false"
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_READ_ACCESS_TOKEN }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          ENABLE_PAGESPEED: ${{ vars.ENABLE_PAGESPEED || 'false' }}
          ENABLE_PUBLIC_CRAWL: ${{ vars.ENABLE_PUBLIC_CRAWL || 'false' }}
      - run: python scripts/validate-public-data.py private/public-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-safe-report
          path: private/public-report.json
          retention-days: 7
          if-no-files-found: error
      - name: Encrypt detailed reports before upload
        env:
          PRIVATE_REPORT_ENCRYPTION_KEY: ${{ secrets.PRIVATE_REPORT_ENCRYPTION_KEY }}
        run: |
          if [ -n "$PRIVATE_REPORT_ENCRYPTION_KEY" ] && [ -f private/latest.ndjson ]; then
            python scripts/encrypt-private-report.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-private-report
          path: private/private-report.zip.enc
          retention-days: 7
          if-no-files-found: ignore
